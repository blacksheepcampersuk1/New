<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    :root {
      --page-bg: #dfe3dc;
      --panel-bg: #dfe8d9;
      --dark-text: #1f1f1f;
      --button-active: #2d3d2b;
      --button-bg: #f5f5f3;
      --line: #c8cdc2;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--dark-text);
    }
    body {
      display: flex;
      justify-content: center;
      padding: 0;
    }
    .page-shell {
      width: min(1280px, 100%);
      min-height: 100vh;
      background: var(--page-bg);
      padding: 0 0 32px;
    }
    .product-layout {
      width: 100%;
      padding: 28px 42px 30px;
      min-height: 780px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(260px, 0.9fr);
      gap: 46px;
      align-items: start;
      max-width: 1100px;
      margin: 0 auto;
    }
    .viewer-card {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-top: 4px;
    }
    .viewer-box {
      position: relative;
      width: 100%;
      min-height: 486px;
      border: 1px solid rgba(46,45,42,0.3);
      background: #dfe3dc;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }
    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 486px;
      background: #dfe3dc;
      border-radius: 0;
    }
    .viewer-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
      color: #333;
      font-size: 18px;
      font-weight: 600;
      z-index: 3;
    }
    .product-info {
      padding-top: 12px;
    }
    .product-title {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
      font-weight: 800;
      color: #111;
    }
    .product-price {
      margin-top: 10px;
      color: #303030;
      font-size: 13px;
      font-weight: 600;
    }
    .product-price strong {
      font-size: 15px;
      font-weight: 800;
    }
    .configurator-panel {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 360px;
    }
    .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }
    .row-title {
      font-weight: 700;
      font-size: 14px;
      color: #1c1c1c;
      letter-spacing: 0.01em;
      margin-bottom: 2px;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }
    button {
      appearance: none;
      border: 1px solid #2d2d2d;
      background: #f5f4f1;
      color: #1b1b1b;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.active {
      background: var(--button-active);
      color: white;
      border-color: var(--button-active);
    }
    .layout-btn, .package-btn, .cushion-btn {
      min-width: 0;
      flex: 1;
      text-align: center;
    }
    .request-btn {
      width: 100%;
      background: #2a3c2d;
      color: white;
      border-color: #2a3c2d;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 16px;
      border-radius: 4px;
      letter-spacing: 0.02em;
      margin-top: 4px;
    }
    .product-description {
      margin-top: 0;
      padding: 16px 18px;
      border: 1px solid rgba(30, 30, 30, 0.08);
      border-radius: 6px;
      background: var(--page-bg);
      color: #222;
      font-size: 13px;
      line-height: 1.6;
      font-weight: 700;
      width: 100%;
      max-width: 100%;
      text-align: left;
    }
    @media (max-width: 900px) {
      .page-shell { padding: 12px 12px 24px; }
      .product-grid { grid-template-columns: 1fr; }
      .product-info { padding-top: 0; }
      .configurator-panel { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="product-layout">
      <div class="product-grid">
        <section class="viewer-card" aria-label="Product viewer section">
          <div class="viewer-box">
            <model-viewer
              id="cupboard-viewer"
              src="Twin%20Bench.glb"
              camera-controls
              style="width:100%; height:100%; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:0;">
            </model-viewer>
            <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
          </div>
          <div id="product-description" class="product-description" aria-live="polite"></div>
        </section>

        <aside class="product-info" aria-label="Product configuration panel">
          <h1 id="product-title" class="product-title">The twin bench -<br>furniture only</h1>
          <div class="product-price"><strong>£0.00</strong></div>

          <div class="configurator-panel">
            <div class="row">
              <span class="row-title">Package</span>
              <div class="btn-group">
                <button class="package-btn active" type="button" data-package="Furniture Only">Furniture Only</button>
                <button class="package-btn" type="button" data-package="Full Conversion">Full Conversion</button>
              </div>
            </div>

            <div class="row">
              <span class="row-title">Layout</span>
              <div class="btn-group">
                <button class="layout-btn active" type="button" data-size="Twin%20Bench.glb">Twin Bench</button>
                <button class="layout-btn" type="button" data-size="Ewe.glb">Ewe</button>
                <button class="layout-btn" type="button" data-size="Belted%20Ewe.glb">Belted Ewe</button>
              </div>
            </div>

            <div class="row">
              <span class="row-title">Cushions</span>
              <div class="btn-group">
                <button class="cushion-btn" type="button" data-cushion="Cushions">With Cushions</button>
                <button class="cushion-btn active" type="button" data-cushion="Without%20Cushions">Without Cushions</button>
              </div>
            </div>

            <button id="request-quote-btn" class="request-btn" type="button">Enquire now</button>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    const VALID_MODELS = {
      'Twin%20Bench.glb': 'Twin%20Bench.glb',
      'Ewe.glb': 'Ewe.glb',
      'Belted%20Ewe.glb': 'Belted%20Ewe.glb',
      twin: 'Twin%20Bench.glb',
      ewe: 'Ewe.glb',
      'belted-ewe': 'Belted%20Ewe.glb',
      belted: 'Belted%20Ewe.glb'
    };

    const MODEL_DEFAULT_ORBIT = {
      'Twin%20Bench.glb': '135deg 75deg auto',
      'Ewe.glb': '315deg 75deg auto',
      'Belted%20Ewe.glb': '315deg 75deg auto'
    };

    const modelViewer = document.querySelector('#cupboard-viewer');
    const spinner = document.querySelector('#viewer-spinner');
    const descriptionEl = document.getElementById('product-description');
    const titleEl = document.getElementById('product-title');

    const params = new URLSearchParams(window.location.search);
    const requestedModel = params.get('model');
    let selectedModel = VALID_MODELS[requestedModel || 'twin'] || 'Twin%20Bench.glb';
    let selectedPackage = 'Furniture Only';
    let selectedCushions = 'Without%20Cushions';

    function applyTitle() {
      const name = selectedModel === 'Ewe.glb'
        ? 'The ewe shape'
        : selectedModel === 'Belted%20Ewe.glb'
          ? 'The belted ewe'
          : 'The twin bench';
      titleEl.innerHTML = `${name} -<br>${selectedPackage.toLowerCase()}`;
    }

    function setModelFile(fileName) {
      modelViewer.setAttribute('src', fileName);
      modelViewer.cameraOrbit = MODEL_DEFAULT_ORBIT[fileName] || '135deg 75deg auto';
      modelViewer.style.visibility = 'visible';
      modelViewer.style.opacity = '1';
      spinner.style.display = 'none';
    }

    function syncButtonStates() {
      document.querySelectorAll('.layout-btn').forEach((button) => {
        button.classList.toggle('active', button.getAttribute('data-size') === selectedModel);
      });

      document.querySelectorAll('.package-btn').forEach((button) => {
        button.classList.toggle('active', button.getAttribute('data-package') === selectedPackage);
      });

      document.querySelectorAll('.cushion-btn').forEach((button) => {
        const isActive = button.getAttribute('data-cushion') === selectedCushions;
        button.classList.toggle('active', isActive);
      });
    }

    function updateDescription() {
      const labels = {
        'Twin%20Bench.glb': 'A compact twin bench design built for everyday use, with a versatile fit for modern van living.',
        'Ewe.glb': 'The ewe shape brings a softer, more sculpted silhouette with practical storage and comfort in mind.',
        'Belted%20Ewe.glb': 'The belted ewe combines a distinctive profile with a refined, premium layout for a standout interior.'
      };
      descriptionEl.textContent = labels[selectedModel] || labels['Twin%20Bench.glb'];
    }

    function updateUrl() {
      const params = new URLSearchParams(window.location.search);
      params.set('model', selectedModel);
      const nextUrl = `${window.location.pathname}?${params.toString()}`;
      window.history.replaceState({}, '', nextUrl);
    }

    function applyModelFromUrl() {
      selectedModel = VALID_MODELS[requestedModel || 'twin'] || 'Twin%20Bench.glb';
      syncButtonStates();
      applyTitle();
      updateDescription();
      setModelFile(selectedModel);
      updateUrl();
    }

    document.querySelectorAll('.layout-btn').forEach((button) => {
      button.addEventListener('click', () => {
        selectedModel = button.getAttribute('data-size');
        syncButtonStates();
        applyTitle();
        updateDescription();
        setModelFile(selectedModel);
        updateUrl();
      });
    });

    document.querySelectorAll('.package-btn').forEach((button) => {
      button.addEventListener('click', () => {
        selectedPackage = button.getAttribute('data-package');
        syncButtonStates();
        applyTitle();
      });
    });

    document.querySelectorAll('.cushion-btn').forEach((button) => {
      button.addEventListener('click', () => {
        selectedCushions = button.getAttribute('data-cushion');
        syncButtonStates();
      });
    });

    applyModelFromUrl();
  </script>
</body>
</html>
