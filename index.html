<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Cupboard Configurator</title>
  <link rel="preload" href="Twin%20Bench.glb" as="fetch" crossorigin>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    :root {
      --page-bg: #dfe3dc;
      --panel-bg: #dfe8d9;
      --panel-soft: #ecf0ea;
      --header-bg: #f5f1f0;
      --toolbar-bg: #f6f5f3;
      --dark-text: #1f1f1f;
      --muted-text: #5b5b5b;
      --line: #c8cdc2;
      --button-line: #2e2d2b;
      --button-bg: #f5f5f3;
      --button-active: #2d3d2b;
      --button-active-2: #3c4f3a;
      --accent: #1b2d1e;
      --soft-green: #e3e8df;
      --shadow: rgba(0,0,0,0.08);
      --model-bg: #dfe3dc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--dark-text);
    }

    body {
      display: flex;
      justify-content: center;
      padding: 0;
      background: var(--page-bg);
    }

    .page-shell {
      width: min(1280px, 100%);
      min-height: 100vh;
      background: var(--page-bg);
      padding: 0 0 32px;
      box-shadow: none;
    }

    .topbar {
      display: none !important;
    }

    .product-layout {
      width: 100%;
      background: var(--page-bg);
      border: 0;
      border-top: 0;
      padding: 28px 42px 30px;
      min-height: 780px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(260px, 0.9fr);
      gap: 46px;
      align-items: start;
      max-width: 1100px;
      margin: 0 auto;
    }

    .viewer-card {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-top: 4px;
    }

    .viewer-box {
      position: relative;
      width: 100%;
      min-height: 486px;
      border: 1px solid rgba(46,45,42,0.3);
      background: var(--model-bg);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .viewer-box .viewer-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
      color: #333;
      font-size: 18px;
      font-weight: 600;
      z-index: 3;
      position: absolute;
      inset: 0;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 486px;
      background: var(--model-bg);
      border-radius: 0;
      --progress-bar-color: #1a2d1d;
    }

    .thumb-box {
      width: 100%;
      height: 188px;
      border: 1px solid rgba(46,45,42,0.3);
      background: var(--model-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
    }

    .product-info {
      padding-top: 12px;
    }

    .product-title {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
      font-weight: 800;
      color: #111;
    }

    .product-price {
      margin-top: 10px;
      color: #303030;
      font-size: 13px;
      font-weight: 600;
    }

    .product-price strong {
      font-size: 15px;
      font-weight: 800;
    }

    .configurator-panel {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      max-width: 320px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }

    .row-title {
      min-width: 0;
      font-weight: 700;
      font-size: 14px;
      color: #1c1c1c;
      letter-spacing: 0.01em;
      margin-bottom: 2px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
    }

    button {
      appearance: none;
      border: 1px solid #2d2d2d;
      background: #f5f4f1;
      color: #1b1b1b;
      border-radius: 4px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:not(.icon-btn):hover {
      filter: brightness(0.98);
    }

    button.active {
      background: var(--button-active);
      color: white;
      border-color: var(--button-active);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .size-btn,
    .door-btn,
    .cushion-btn {
      min-width: 56px;
      padding: 10px 11px;
    }

    .door-btn {
      min-width: 52px;
    }

    .door-btn[data-door="Green"],
    .door-btn[data-door="Blue"],
    .door-btn[data-door="Black"],
    .door-btn[data-door="Cream"] {
      position: relative;
      min-width: 42px;
      width: 42px;
      height: 36px;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .door-btn[data-door="Green"]::before,
    .door-btn[data-door="Blue"]::before,
    .door-btn[data-door="Black"]::before,
    .door-btn[data-door="Cream"]::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 3px;
      background: var(--swatch-color, #d1d1d1);
      border: 1px solid rgba(0,0,0,0.35);
    }

    .door-btn[data-door="Green"] { --swatch-color: #3d4c3d; }
    .door-btn[data-door="Blue"] { --swatch-color: #a8b5ba; }
    .door-btn[data-door="Black"] { --swatch-color: #171717; }
    .door-btn[data-door="Cream"] { --swatch-color: #efeae1; }

    .door-btn.active::before {
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.9), 0 0 0 2px rgba(17,17,17,0.9);
    }

    .door-btn.active {
      background: transparent;
      border-color: rgba(0,0,0,0.7);
      box-shadow: none;
    }

    .cushion-btn {
      min-width: 0;
      flex: 1;
      text-align: center;
    }

    .request-btn {
      width: 100%;
      background: #2a3c2d;
      color: white;
      border-color: #2a3c2d;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 16px;
      border-radius: 4px;
      letter-spacing: 0.02em;
      margin-top: 4px;
    }

    .request-btn:hover {
      background: #1f2d22;
    }

    .info-stack {
      margin-top: 22px;
      border-top: 1px solid rgba(0,0,0,0.22);
      padding-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-item {
      border-top: 1px solid rgba(0,0,0,0.18);
      padding-top: 12px;
      font-weight: 700;
      color: #1d1d1d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .info-item:first-child {
      border-top: none;
      padding-top: 0;
    }

    .info-item .plus {
      font-size: 18px;
      line-height: 1;
      font-weight: 700;
      opacity: 0.9;
    }

    .social-row {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      padding-top: 20px;
      margin-top: 8px;
    }

    .social-row .icon-btn {
      background: transparent;
      border: 1px solid rgba(0,0,0,0.25);
      width: 32px;
      height: 32px;
      font-size: 12px;
    }

    .view-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255,255,255,0.78);
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      z-index: 6;
    }

    .view-controls .row {
      display: flex;
      gap: 8px;
      flex-direction: row;
    }

    .view-controls button {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
      background: white;
      border: 1px solid #d7d7d7;
    }

    @media (max-width: 900px) {
      .page-shell { padding: 12px 12px 24px; }
      .product-grid {
        grid-template-columns: 1fr;
      }
      .product-info {
        padding-top: 0;
      }
      .configurator-panel {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="product-layout">
      <div class="product-grid">
        <section class="viewer-card" aria-label="Product viewer section">
          <div class="viewer-box">
            <model-viewer
              id="cupboard-viewer"
              src="Twin%20Bench.glb"
              camera-controls
              style="width:100%; height:100%; visibility:hidden; opacity:0; transition:opacity .25s; border-radius:0;">
            </model-viewer>

            <div class="view-controls" id="view-controls">
              <div class="row">
                <button data-rotate="left" type="button">Rotate Left</button>
                <button data-rotate="right" type="button">Rotate Right</button>
              </div>
            </div>

            <div id="viewer-spinner" class="viewer-overlay">Loading model…</div>
          </div>

          <div class="thumb-box" aria-hidden="true"></div>
        </section>

        <aside class="product-info" aria-label="Product configuration panel">
          <h1 class="product-title">The ewe shape -<br>furniture only</h1>
          <div class="product-price">From <strong>£1,395.00</strong></div>

          <div class="configurator-panel">
            <div class="row">
              <span class="row-title">Color</span>
              <div class="btn-group">
                <button class="door-btn active" type="button" data-door="Green" aria-label="Green"></button>
                <button class="door-btn" type="button" data-door="Blue" aria-label="Blue"></button>
                <button class="door-btn" type="button" data-door="Black" aria-label="Black"></button>
                <button class="door-btn" type="button" data-door="Cream" aria-label="Cream"></button>
              </div>
            </div>

            <div class="row">
              <span class="row-title">Wheelbase</span>
              <div class="btn-group">
                <button class="size-btn" type="button" data-size="Ewe.glb">SWB</button>
                <button class="size-btn active" type="button" data-size="Twin%20Bench.glb">LWB</button>
              </div>
            </div>

            <div class="row">
              <span class="row-title">Cushions</span>
              <div class="btn-group">
                <button class="cushion-btn" type="button" data-cushion="Cushions">With Cushions</button>
                <button class="cushion-btn active" type="button" data-cushion="Without%20Cushions">Without Cushions</button>
              </div>
            </div>

            <div class="row">
              <span class="row-title">Quantity</span>
              <div class="btn-group" style="max-width: 120px; display:flex; justify-content:space-between; align-items:center;">
                <button type="button" aria-label="Decrease quantity" style="min-width: 36px; width: 36px;">−</button>
                <span style="font-weight:700; min-width: 22px; text-align:center;">1</span>
                <button type="button" aria-label="Increase quantity" style="min-width: 36px; width: 36px;">+</button>
              </div>
            </div>

            <button id="request-quote-btn" class="request-btn" type="button">Enquire now</button>
          </div>

          <div class="info-stack" aria-label="Additional product information">
            <div class="info-item"><span>Product info</span><span class="plus">＋</span></div>
            <div class="info-item"><span>Core features</span><span class="plus">＋</span></div>
            <div class="info-item"><span>Additional features</span><span class="plus">＋</span></div>
          </div>

          <div class="social-row" aria-label="Social media links">
            <button type="button" class="icon-btn" aria-label="Facebook">f</button>
            <button type="button" class="icon-btn" aria-label="Instagram">◎</button>
            <button type="button" class="icon-btn" aria-label="Pinterest">P</button>
            <button type="button" class="icon-btn" aria-label="X">X</button>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div id="form-modal" role="dialog" aria-modal="true" style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:9999;">
    <div id="form-modal-card" style="width:92%; max-width:960px; height:86%; background:#fff; border-radius:10px; overflow:hidden; position:relative; box-shadow:0 20px 40px rgba(0,0,0,0.4);">
      <button id="form-modal-close" aria-label="Close form" style="position:absolute; right:12px; top:12px; z-index:5; padding:8px 10px; border-radius:6px; border:1px solid #ddd; background:#fff; cursor:pointer;">Close</button>
      <div id="form-modal-spinner" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6)); color:#333; font-weight:600;">Loading form…</div>
      <iframe id="form-modal-iframe" src="" frameborder="0" title="Quote form" style="width:100%; height:100%; border:0; display:block;"></iframe>
    </div>
  </div>

  <script>
    const modelViewer = document.querySelector('#cupboard-viewer');
    const spinner = document.querySelector('#viewer-spinner');
    const viewControls = document.querySelector('#view-controls');

    let selectedModel = 'Twin%20Bench.glb';
    let selectedCushions = 'Without%20Cushions';
    let selectedDoor = 'Green';

    const MODEL_DEFAULT_ORBIT = {
      'Twin%20Bench.glb': '135deg 75deg auto',
      'Twin%20Bench%20Cushion.glb': '135deg 75deg auto',
      'Ewe.glb': '315deg 75deg auto',
      'Ewe%20Cushion.glb': '315deg 75deg auto',
      'Belted%20Ewe.glb': '315deg 75deg auto',
      'Belted%20Ewe%20Cushion.glb': '315deg 75deg auto'
    };

    const MODEL_CUSHION_FILES = {
      'Twin%20Bench.glb': 'Twin%20Bench%20Cushion.glb',
      'Ewe.glb': 'Ewe%20Cushion.glb',
      'Belted%20Ewe.glb': 'Belted%20Ewe%20Cushion.glb'
    };

    const ROTATION_STEP = 45;
    const DEFAULT_ORBIT = MODEL_DEFAULT_ORBIT[selectedModel];

    let initialLoadDone = false;
    let userHasManualView = false;
    let savedOrbitToRestore = null;

    function getActiveModelFile() {
      if (selectedCushions === 'Cushions') {
        return MODEL_CUSHION_FILES[selectedModel] || selectedModel;
      }
      return selectedModel;
    }

    function getModelVariantName(variantName) {
      const activeModel = getActiveModelFile();
      if (activeModel && activeModel.includes('Cushion') && (variantName === 'Black' || variantName === 'Blue')) {
        return variantName === 'Black' ? 'Blue' : 'Black';
      }
      return variantName;
    }

    function showViewer() {
      spinner.style.display = 'none';
      modelViewer.style.visibility = 'visible';
      modelViewer.style.opacity = '1';
    }

    function showSpinnerMessage(msg) {
      spinner.style.display = 'flex';
      spinner.textContent = msg;
      modelViewer.style.visibility = 'hidden';
      modelViewer.style.opacity = '0';
    }

    function applyVariant(name) {
      const variantName = getModelVariantName(name || selectedDoor);
      try {
        if (typeof modelViewer.variantName !== 'undefined') {
          modelViewer.variantName = variantName;
        }
        modelViewer.setAttribute('variant-name', variantName);
      } catch (err) {
        console.warn('Error applying variant:', err);
      }
    }

    function rotateBy(deg) {
      try {
        const orbit = modelViewer.cameraOrbit || DEFAULT_ORBIT || '135deg 75deg auto';
        const parts = orbit.trim().split(/\s+/);
        if (parts.length < 3) return;

        const azMatch = parts[0].match(/(-?[0-9.]+)deg/);
        if (!azMatch) return;

        let azValue = parseFloat(azMatch[1]);
        azValue = (azValue + deg) % 360;
        if (azValue < 0) azValue += 360;

        modelViewer.cameraOrbit = `${azValue}deg ${parts[1]} ${parts[2]}`;
        userHasManualView = true;
        savedOrbitToRestore = modelViewer.cameraOrbit;
      } catch (err) {
        console.warn('rotateBy error:', err);
      }
    }

    function setModelFile(fileName) {
      const orbitToUse = userHasManualView && savedOrbitToRestore
        ? savedOrbitToRestore
        : (MODEL_DEFAULT_ORBIT[fileName] || DEFAULT_ORBIT || '135deg 75deg auto');

      try { modelViewer.cameraOrbit = orbitToUse; } catch (err) {}
      modelViewer.setAttribute('src', fileName);
    }

    function refreshVariantAfterLoad() {
      requestAnimationFrame(() => applyVariant(selectedDoor));
      setTimeout(() => applyVariant(selectedDoor), 150);
    }

    modelViewer.addEventListener('load', () => {
      if (!initialLoadDone) {
        modelViewer.cameraOrbit = MODEL_DEFAULT_ORBIT[getActiveModelFile()] || DEFAULT_ORBIT;
        initialLoadDone = true;
      }
      refreshVariantAfterLoad();
      showViewer();
    }, { once: true });

    let retryCount = 0;
    modelViewer.addEventListener('error', (ev) => {
      console.error('model-viewer error event:', ev);
      if (retryCount < 3) {
        retryCount++;
        showSpinnerMessage(`Model failed to load — retrying (${retryCount}/3)…`);
        setTimeout(() => {
          const src = modelViewer.getAttribute('src');
          modelViewer.removeAttribute('src');
          setTimeout(() => modelViewer.setAttribute('src', src), 50);
        }, 900 * retryCount);
      } else {
        showSpinnerMessage('Model failed to load. Check network or upload the GLB.');
      }
    });

    function updateConfigurator() {
      const targetFileUrl = getActiveModelFile();
      const currentSrcAttr = modelViewer.getAttribute('src');

      if (currentSrcAttr !== targetFileUrl) {
        showSpinnerMessage('Loading model…');
        setModelFile(targetFileUrl);

        modelViewer.addEventListener('load', () => {
          if (userHasManualView && savedOrbitToRestore) {
            try { modelViewer.cameraOrbit = savedOrbitToRestore; } catch (err) {}
          } else {
            try { modelViewer.cameraOrbit = MODEL_DEFAULT_ORBIT[targetFileUrl] || DEFAULT_ORBIT; } catch (err) {}
          }

          refreshVariantAfterLoad();
          showViewer();
        }, { once: true });
      } else {
        applyVariant(selectedDoor);
      }
    }

    document.querySelectorAll('.size-btn').forEach((button) => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.size-btn').forEach((btn) => btn.classList.remove('active'));
        e.target.classList.add('active');
        selectedModel = e.target.getAttribute('data-size');

        if (userHasManualView) {
          try { savedOrbitToRestore = modelViewer.cameraOrbit || null; } catch (err) { savedOrbitToRestore = null; }
        } else {
          savedOrbitToRestore = null;
        }

        updateConfigurator();
      });
    });

    document.querySelectorAll('.cushion-btn').forEach((button) => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.cushion-btn').forEach((btn) => btn.classList.remove('active'));
        e.target.classList.add('active');
        selectedCushions = e.target.getAttribute('data-cushion');
        updateConfigurator();
      });
    });

    document.querySelectorAll('.door-btn').forEach((button) => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.door-btn').forEach((btn) => btn.classList.remove('active'));
        e.target.classList.add('active');
        selectedDoor = e.target.getAttribute('data-door');
        updateConfigurator();
      });
    });

    viewControls.addEventListener('click', (ev) => {
      const btn = ev.target.closest('button[data-rotate]');
      if (!btn) return;
      const dir = btn.getAttribute('data-rotate');
      if (dir === 'left') rotateBy(ROTATION_STEP);
      if (dir === 'right') rotateBy(-ROTATION_STEP);
    });

    modelViewer.addEventListener('camera-change', () => {
      try {
        userHasManualView = true;
        savedOrbitToRestore = modelViewer.cameraOrbit;
      } catch (err) {}
    });

    updateConfigurator();

    const WIX_FORM_URLS = {
      'Ewe.glb': 'https://blacksheepcampers.wixforms.com/f/7516869375056413788',
      'Twin%20Bench.glb': 'https://blacksheepcampers.wixforms.com/f/7516871135326110811',
      'Belted%20Ewe.glb': 'https://blacksheepcampers.wixforms.com/f/7516871286258140321'
    };

    const modal = document.getElementById('form-modal');
    const modalIframe = document.getElementById('form-modal-iframe');
    const modalSpinner = document.getElementById('form-modal-spinner');
    const modalClose = document.getElementById('form-modal-close');

    async function openFormOverlay(url) {
      modalIframe.src = '';
      modalSpinner.style.display = 'flex';
      modal.style.display = 'flex';

      let didLoad = false;
      const loadPromise = new Promise((resolve) => {
        modalIframe.onload = () => {
          didLoad = true;
          modalSpinner.style.display = 'none';
          resolve(true);
        };
        modalIframe.onerror = () => {
          didLoad = false;
          resolve(false);
        };
      });

      modalIframe.src = url;

      const winner = await Promise.race([
        loadPromise,
        new Promise((res) => setTimeout(() => res(false), 3500))
      ]);

      if (!winner || !didLoad) {
        modal.style.display = 'none';
        modalIframe.src = '';
        window.open(url, '_blank');
        alert('The form could not be embedded in this page, so it has been opened in a new tab instead.');
      }
    }

    modalClose.addEventListener('click', () => {
      modal.style.display = 'none';
      modalIframe.src = '';
    });

    document.getElementById('request-quote-btn').addEventListener('click', () => {
      const modelKey = selectedModel || '';
      const target = WIX_FORM_URLS[modelKey] || WIX_FORM_URLS['Twin%20Bench.glb'];
      openFormOverlay(target);
    });
  </script>
</body>
</html>
